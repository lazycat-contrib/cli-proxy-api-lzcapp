params:
  - id: api_key
    type: secret
    name: Client API Key
    description: Authoritative alphanumeric API key for OpenAI-compatible clients; changing it reconfigures the first API key on restart
    default_value: "$random(len=32)"
    optional: false

  - id: management_key
    type: secret
    name: Management Key
    description: Authoritative alphanumeric management key; changing it reconfigures the management API on restart
    default_value: "$random(len=32)"
    optional: false

  - id: timezone
    type: string
    name: Time Zone
    description: IANA time zone such as Asia/Shanghai, Etc/UTC, Europe/London, or America/New_York
    default_value: Asia/Shanghai
    optional: false

locales:
  zh:
    api_key:
      name: 客户端 API 密钥
      description: OpenAI 兼容客户端使用的权威字母数字密钥；修改后会在重启时更新第一枚 API Key
    management_key:
      name: 管理密钥
      description: 远程管理 API 和控制面板使用的权威字母数字密钥；修改后会在重启时生效
    timezone:
      name: 时区
      description: IANA 时区，例如 Asia/Shanghai、Etc/UTC、Europe/London 或 America/New_York
  en:
    api_key:
      name: Client API Key
      description: Authoritative alphanumeric client key; changes update the first API key on restart
    management_key:
      name: Management Key
      description: Authoritative alphanumeric management key; changes take effect on restart
    timezone:
      name: Time Zone
      description: IANA time zone such as Asia/Shanghai, Etc/UTC, Europe/London, or America/New_York
